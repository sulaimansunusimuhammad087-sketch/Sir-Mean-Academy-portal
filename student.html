<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#14532d;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:1100px;
margin:30px auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

.card h3{
color:#14532d;
margin-bottom:10px;
}

.status{
color:orange;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>Student Dashboard</h1>
</header>

<div class="container">

<div class="card">
<h3>Student Information</h3>

<p><strong>Name:</strong> <span id="studentName"></span></p>

<p><strong>Application ID:</strong>
<span id="applicationId"></span></p>

<p><strong>Registration No:</strong>
<span id="regNumber"></span></p>

<p><strong>Course:</strong>
<span id="course"></span></p>

<p><strong>Institution:</strong>
<span id="institution"></span></p>

<p><strong>Department:</strong>
<span id="department"></span></p>

<p><strong>Level:</strong>
<span id="level"></span></p>

<p><strong>Status:</strong>
<span class="status" id="status"></span></p>

</div>

<div class="card">
<h3>Examinations</h3>
<p>No examination available yet.</p>
</div>

<div class="card">
<h3>Results</h3>
<p>No result available yet.</p>
</div>

<div class="card">
<h3>Certificate</h3>
<p>Certificate will become available after successful completion.</p>
</div>

</div>

<script>

const student =
JSON.parse(localStorage.getItem("studentData"));

if(!student){
    alert("Please login first.");
    window.location.href = "login.html";
}

document.getElementById("studentName").textContent =
student.fullName || "";

document.getElementById("applicationId").textContent =
student.applicationId || "";

document.getElementById("regNumber").textContent =
student.regNumber || "Awaiting Approval";

document.getElementById("course").textContent =
student.course || "";

document.getElementById("institution").textContent =
student.institution || "";

document.getElementById("department").textContent =
student.department || "";

document.getElementById("level").textContent =
student.level || "";

document.getElementById("status").textContent =
student.status || "Pending";

</script>
  
</body>
</html>
