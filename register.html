<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply | Sir Mean Academy</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f4f6f9;
}

.container{
max-width:800px;
margin:40px auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo img{
width:100px;
height:100px;
border-radius:50%;
}

h1{
text-align:center;
color:#14532d;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

input,
select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:14px;
background:#14532d;
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#166534;
}

.note{
margin-top:20px;
padding:15px;
background:#ecfdf5;
border-left:5px solid #16a34a;
color:#14532d;
}

.back{
display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
color:#14532d;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
<img src="logo.png" alt="Sir Mean Academy">
</div>

<h1>Student Application Form</h1>

<p class="subtitle">
Complete the form below to apply for a course at Sir Mean Academy.
</p>

<form id="applicationForm">

<div class="form-group">
<label>Full Name</label>
<input type="text" required>
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="tel" required>
</div>

<div class="form-group">
<label>Email Address</label>
<input type="email">
</div>

<div class="form-group">
<label>Institution</label>
<input type="text" required>
</div>

<div class="form-group">
<label>Department</label>
<input type="text" required>
</div>

<div class="form-group">
<label>Level</label>
<select required>
<option value="">Select Level</option>
<option>100</option>
<option>200</option>
<option>300</option>
<option>400</option>
<option>500</option>
<option>Graduate</option>
<option>Professional</option>
</select>
</div>

<div class="form-group">
<label>Course</label>
<select required>
<option value="">Select Course</option>
<option>Data Analysis with Microsoft Excel</option>
<option>SQL for Data Analysis</option>
<option>Power BI Fundamentals</option>
<option>Python for Data Analysis</option>
</select>
</div>

<div class="form-group">
<label>Gender</label>
<select required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>
</div>

<div class="form-group">
<label>State</label>
<input type="text" required>
</div>

<div class="form-group">
<label>Profile Photo</label>
<input type="file" accept="image/*">
</div>

<button type="submit">
Submit Application
</button>

</form>

<div class="note">
<strong>Note:</strong>
After submitting your application, it will be reviewed by the Academy Administration. Approved applicants will receive a Registration Number and access to the student portal.
</div>

<a href="index.html" class="back">
← Back to Home
</a>

</div>

</body>
</html>
