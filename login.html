<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | Sir Mean Academy</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.login-box{
background:white;
padding:40px;
width:100%;
max-width:450px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo img{
width:90px;
height:90px;
border-radius:50%;
}

h2{
text-align:center;
color:#14532d;
margin-bottom:10px;
}

p{
text-align:center;
color:#666;
margin-bottom:25px;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:14px;
background:#14532d;
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#166534;
}

.back{
display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
color:#14532d;
font-weight:bold;
}
</style>
</head>

<body>

<div class="login-box">

<div class="logo">
<img src="logo.png" alt="Logo">
</div>

<h2>Student Login</h2>

<p>
Login using your Registration Number and Phone Number.
</p>

<form>

<div class="form-group">
<label>Registration Number</label>
<input type="text" placeholder="SMA-EXCEL-001" required>
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="tel" placeholder="080xxxxxxxx" required>
</div>

<button type="submit">
Login
</button>

</form>

<a href="index.html" class="back">
← Back to Home
</a>

</div>
<script type="module" src="login.js"></script>
</body>
</html>
